# DayTrade news rules. Each rule is a list; a multi-item list means ALL releases must land on the same day ("+").
# A release matches when "<CURRENCY> <event name>" from the calendar STARTS WITH the text here (case-insensitive).
# If a trade rule and a don't-trade rule both fire on a day, don't trade wins.
# X Three and HIGH IMPACT NEWS are not part of the bank levels backtest.
currencies:
  trade:
    - ["USD Crude Oil Inventories"]
    - ["USD ISM Manufacturing PMI"]
    - ["USD Fed's Balance Sheet"]
  dont:
    - ["USD ADP Nonfarm Employment"]
    - ["USD Fed Interest Rate Decision"]
    - ["USD Core PCE Price Index"]
    - ["USD FOMC Meeting Minutes"]
    - ["USD Building Permits"]
    - ["USD FOMC Member Speaks"]
    - ["USD Manufacturing PMI (P)"]
    - ["USD PPI"]
nasdaq:
  trade:
    - ["USD Crude Oil Inventories"]
    - ["USD EIA Short-Term Energy Outlook"]
    - ["USD Fed's Balance Sheet"]
    - ["USD Industrial Production"]
  dont:
    - ["USD ADP Nonfarm Employment"]
    - ["USD FOMC Member Speaks"]
    - ["USD Fed Interest Rate Decision"]
    - ["USD Core PCE Price Index"]
    - ["USD FOMC Meeting Minutes"]
    - ["USD Building Permits"]
    - ["USD Manufacturing PMI (P)"]
    - ["USD PPI"]
us30:
  trade:
    - ["USD Building Permits"]
    - ["USD PPI"]
  dont:
    - ["USD ADP Nonfarm Employment"]
    - ["USD FOMC Member Speaks"]
    - ["USD Fed Interest Rate Decision"]
    - ["USD Core PCE Price Index"]
    - ["USD FOMC Meeting Minutes"]
ger40:
  trade:
    - ["EUR ECB President Lagarde Speaks"]
    - ["EUR CPI"]
    - ["USD Core CPI"]
  dont:
    - ["GBP CPI"]
    - ["GBP GDP"]
    - ["USD Philadelphia Fed", "USD Initial Jobless Claims"]
    - ["USD GDP", "USD Initial Jobless Claims"]
    - ["USD Pending Home Sales", "USD Initial Jobless Claims"]
uk100:
  trade:
    - ["GBP Manufacturing PMI"]
    - ["GBP Services PMI"]
    - ["GBP Composite PMI"]
    - ["GBP Manufacturing Production", "GBP GDP"]
  dont:
    - ["EUR ECB Interest Rate Decision"]
    - ["GBP CPI"]
    - ["GBP GDP"]
    - ["USD Philadelphia Fed", "USD Initial Jobless Claims"]
    - ["USD GDP", "USD Initial Jobless Claims"]
    - ["USD Pending Home Sales", "USD Initial Jobless Claims"]
