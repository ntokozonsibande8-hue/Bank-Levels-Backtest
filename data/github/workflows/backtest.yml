name: Bank levels backtest
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_engine.py
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: dukascopy-raw-${{ github.run_id }}
          restore-keys: dukascopy-raw-
      - run: python fetch_data.py --config config.yaml  --start 2025-01-06 --end 2025-01-10
      - run: python backtest.py --config config.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
