# Bank levels backtest config. All times are SAST (GMT+2).
start: "2024-01-01"
end: "2026-10-01"
news_file: data/news_events.csv      # columns: date,time,currency,event (see data/news_events.example.csv)
rules_file: rules.yaml

# window: AS = 00:00-07:00, AR = 00:00-10:00 (H1 candles)
# symbols use Dukascopy codes; each needs data/<SYMBOL>.csv (made by fetch_data.py or your own export)
markets:
  us30:
    rules: us30
    window: AR
    symbols: [USA30IDXUSD]

