name: Bank levels backtest
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2026-07-01"
      end:
        description: "End date (keep the same every run)"
        default: "2026-10-20"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_engine.py
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: dukascopy-raw-${{ github.run_id }}
          restore-keys: dukascopy-raw-
      - name: Fetch data (stops after 40 minutes, keeps progress)
        run: |
          set +e
          timeout 40m python fetch_data.py --config config.yaml --start ${{ inputs.start }} --end ${{ inputs.end }}
          echo "FETCH_EXIT=$?" >> "$GITHUB_ENV"
          exit 0
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/raw
          key: dukascopy-raw-${{ github.run_id }}
      - run: python backtest.py --config config.yaml --no-news-filter
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data/*.csv
      - name: Fail if the download was incomplete
        if: env.FETCH_EXIT != '0'
        run: |
          echo "Download stopped early (exit code $FETCH_EXIT). Run again to continue."
          exit 1
